<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a192f">
  <title>Thank You | MazinMind Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#0a192f;--panel:#10243e;--text:#f5f5f5;--muted:#cbd5e1;--blue:#60a5fa;--orange:#ff6f00;--green:#64dd17}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top right,#153d63 0,transparent 45%),radial-gradient(ellipse at bottom left,#27305d 0,transparent 42%),var(--bg);color:var(--text);font-family:'Outfit',sans-serif}
    main{width:min(100%,680px);padding:clamp(28px,6vw,56px);text-align:center;border:1px solid rgba(96,165,250,.35);border-radius:24px;background:rgba(16,36,62,.88);box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .mark{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 24px;border-radius:50%;background:rgba(100,221,23,.12);border:1px solid rgba(100,221,23,.5);color:var(--green);font-size:40px}
    .eyebrow{margin:0 0 12px;color:var(--blue);font-size:.82rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0 0 16px;font-size:clamp(2.25rem,7vw,4rem);line-height:1.05;letter-spacing:.02em}
    p{margin:0 auto 28px;max-width:480px;color:var(--muted);font-size:1.1rem;line-height:1.7}
    .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 22px;border-radius:10px;font-weight:700;text-decoration:none;transition:transform .15s ease,opacity .15s ease}
    a:hover{transform:translateY(-2px);opacity:.92}
    .primary{background:var(--orange);color:white}
    .secondary{border:1px solid rgba(203,213,225,.35);color:var(--text)}
    .brand{margin-top:34px;color:#94a3b8;font-size:.85rem;letter-spacing:.08em}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <p class="eyebrow">MazinMind Digital</p>
    <h1>Message received.</h1>
    <p>Thanks for reaching out. Your project inquiry has been submitted. We’ll review the details and follow up using the contact information you provided.</p>
    <div class="actions">
      <a class="primary" href="/">Back to homepage</a>
      <a class="secondary" href="/contact">Contact page</a>
    </div>
    <div class="brand">AI • AUTOMATION • CLOUD ENGINEERING</div>
  </main>

  <script>
    // Count a successful Zoho Web-to-Lead conversion only when the visitor
    // has already granted optional analytics consent on the main website.
    (function () {
      var analyticsConsent = false;
      try {
        var preferences = JSON.parse(localStorage.getItem("mazinmind_cookie_preferences_v1") || "{}");
        analyticsConsent = preferences.analytics === true;
      } catch (error) {
        analyticsConsent = false;
      }
      if (!analyticsConsent) return;

      var measurementId = "__GA_MEASUREMENT_ID__";
      if (!/^G-[A-Z0-9]+$/i.test(measurementId)) return;

      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
      window.gtag("js", new Date());
      window.gtag("config", measurementId, { send_page_view: false });

      var analyticsScript = document.createElement("script");
      analyticsScript.id = "google-analytics-script";
      analyticsScript.async = true;
      analyticsScript.src = "https://www.googletagmanager.com/gtag/js?id=" + measurementId;
      document.head.appendChild(analyticsScript);

      window.gtag("event", "page_view", {
        page_location: window.location.href,
        page_title: document.title,
        page_path: window.location.pathname
      });
      window.gtag("event", "generate_lead", {
        form_name: "zoho_contact_webform",
        form_provider: "zoho"
      });
    })();
  </script>

</body>
</html>
