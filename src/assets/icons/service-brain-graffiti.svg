<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .icon-main { fill: none; stroke: #22d3ee; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-accent { fill: none; stroke: #fbbf24; stroke-width: 2; }
      .icon-glow { filter: drop-shadow(0 0 4px rgba(34, 211, 238, 0.6)); }
      .spark { fill: #ec4899; }
      @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
      .spark-anim { animation: pulse 2s ease-in-out infinite; }
    </style>
    <filter id="icon-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Brain top left lobe -->
  <path class="icon-main icon-glow" d="M 70 80 Q 60 60 75 50 Q 85 45 90 55 Q 85 65 75 75 Z"/>
  
  <!-- Brain top center lobe -->
  <path class="icon-main icon-glow" d="M 100 40 Q 90 35 100 45 Q 110 35 120 40 Q 115 55 100 65 Z"/>
  
  <!-- Brain top right lobe -->
  <path class="icon-main icon-glow" d="M 130 80 Q 140 60 125 50 Q 115 45 110 55 Q 115 65 125 75 Z"/>
  
  <!-- Brain left side -->
  <path class="icon-main icon-glow" d="M 65 95 Q 50 90 55 110 Q 60 125 75 120"/>
  
  <!-- Brain center -->
  <path class="icon-main icon-glow" d="M 100 75 Q 95 70 100 100 Q 105 130 100 140"/>
  
  <!-- Brain right side -->
  <path class="icon-main icon-glow" d="M 135 95 Q 150 90 145 110 Q 140 125 125 120"/>
  
  <!-- Brain stem -->
  <path class="icon-main icon-glow" d="M 95 140 Q 100 155 95 170 M 105 140 Q 100 155 105 170"/>
  
  <!-- Circuit pattern lines -->
  <path class="icon-accent icon-glow" d="M 70 90 L 85 85 L 90 100 L 75 110"/>
  <path class="icon-accent icon-glow" d="M 130 90 L 115 85 L 110 100 L 125 110"/>
  
  <!-- Highlight nodes -->
  <circle class="spark spark-anim" cx="80" cy="80" r="2.5"/>
  <circle class="spark spark-anim" cx="100" cy="55" r="2.5" style="animation-delay: 0.3s"/>
  <circle class="spark spark-anim" cx="120" cy="80" r="2.5" style="animation-delay: 0.6s"/>
  
  <!-- Neon border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
</svg>
