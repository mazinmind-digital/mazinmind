<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .icon-main { fill: none; stroke: #22d3ee; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-accent { fill: none; stroke: #fbbf24; stroke-width: 2; }
      .icon-glow { filter: drop-shadow(0 0 4px rgba(34, 211, 238, 0.6)); }
      .spark { fill: #ec4899; }
      @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
      .spark-anim { animation: pulse 2s ease-in-out infinite; }
    </style>
    <filter id="icon-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Main gear -->
  <circle class="icon-main icon-glow" cx="100" cy="90" r="25"/>
  <g class="icon-main icon-glow">
    <path d="M 120 85 L 135 75"/>
    <path d="M 125 90 L 142 90"/>
    <path d="M 120 95 L 135 105"/>
    <path d="M 80 85 L 65 75"/>
    <path d="M 75 90 L 58 90"/>
    <path d="M 80 95 L 65 105"/>
  </g>
  
  <!-- Gear teeth -->
  <circle class="icon-accent icon-glow" cx="100" cy="90" r="22"/>
  
  <!-- Secondary gear (top right) -->
  <circle class="icon-main icon-glow" cx="135" cy="60" r="15"/>
  <g class="icon-main icon-glow" opacity="0.7">
    <path d="M 145 55 L 155 50"/>
    <path d="M 148 60 L 160 60"/>
    <path d="M 145 65 L 155 70"/>
  </g>
  
  <!-- Secondary gear (bottom left) -->
  <circle class="icon-main icon-glow" cx="65" cy="130" r="12"/>
  <g class="icon-main icon-glow" opacity="0.7">
    <path d="M 70 140 L 75 150"/>
    <path d="M 60 135 L 50 140"/>
  </g>
  
  <!-- Connection lines -->
  <line class="icon-accent icon-glow" x1="120" y1="85" x2="135" y2="60"/>
  <line class="icon-accent icon-glow" x1="80" y1="95" x2="65" y2="130"/>
  
  <!-- Speed indicator -->
  <circle class="spark spark-anim" cx="135" cy="60" r="2"/>
  <circle class="spark spark-anim" cx="100" cy="90" r="2.5" style="animation-delay: 0.2s"/>
  <circle class="spark spark-anim" cx="65" cy="130" r="2" style="animation-delay: 0.4s"/>
  
  <!-- Neon border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
</svg>
