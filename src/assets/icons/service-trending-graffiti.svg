<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .icon-main { fill: none; stroke: #a855f7; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-accent { fill: none; stroke: #fbbf24; stroke-width: 2; }
      .icon-glow { filter: drop-shadow(0 0 4px rgba(168, 85, 247, 0.6)); }
      .spark { fill: #22d3ee; }
      @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
      .spark-anim { animation: pulse 2s ease-in-out infinite; }
    </style>
    <filter id="icon-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Upward trending line -->
  <path class="icon-main icon-glow" d="M 60 140 L 75 110 L 90 125 L 105 80 L 120 95 L 135 45"/>
  
  <!-- Bar chart elements -->
  <line class="icon-accent icon-glow" x1="50" y1="140" x2="50" y2="160" stroke-width="6"/>
  <line class="icon-accent icon-glow" x1="75" y1="125" x2="75" y2="160" stroke-width="6"/>
  <line class="icon-accent icon-glow" x1="100" y1="105" x2="100" y2="160" stroke-width="6"/>
  <line class="icon-accent icon-glow" x1="125" y1="90" x2="125" y2="160" stroke-width="6"/>
  <line class="icon-accent icon-glow" x1="150" y1="65" x2="150" y2="160" stroke-width="6"/>
  
  <!-- Baseline -->
  <line class="icon-main icon-glow" x1="45" y1="160" x2="155" y2="160" stroke-width="2"/>
  
  <!-- Percentage indicator -->
  <text x="100" y="50" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle" filter="url(#icon-glow)">+45%</text>
  
  <!-- Spark points -->
  <circle class="spark spark-anim" cx="105" cy="80" r="2.5"/>
  <circle class="spark spark-anim" cx="135" cy="45" r="2.5" style="animation-delay: 0.3s"/>
  
  <!-- Neon border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>
</svg>
