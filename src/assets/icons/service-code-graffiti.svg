<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .icon-main { fill: none; stroke: #ec4899; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-accent { fill: none; stroke: #22d3ee; stroke-width: 2; }
      .icon-glow { filter: drop-shadow(0 0 4px rgba(236, 72, 153, 0.6)); }
      .spark { fill: #fbbf24; }
      @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
      .spark-anim { animation: pulse 2s ease-in-out infinite; }
    </style>
    <filter id="icon-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#ec4899" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Code bracket angle (left) -->
  <path class="icon-main icon-glow" d="M 70 60 L 60 75 L 70 90"/>
  
  <!-- Code bracket angle (right) -->
  <path class="icon-main icon-glow" d="M 130 60 L 140 75 L 130 90"/>
  
  <!-- Code lines -->
  <line class="icon-accent icon-glow" x1="75" y1="65" x2="115" y2="65"/>
  <line class="icon-accent icon-glow" x1="75" y1="80" x2="125" y2="80"/>
  <line class="icon-accent icon-glow" x1="75" y1="95" x2="110" y2="95"/>
  
  <!-- Closing bracket (left) -->
  <path class="icon-main icon-glow" d="M 70 110 L 60 125 L 70 140"/>
  
  <!-- Closing bracket (right) -->
  <path class="icon-main icon-glow" d="M 130 110 L 140 125 L 130 140"/>
  
  <!-- Code lines (lower) -->
  <line class="icon-accent icon-glow" x1="75" y1="115" x2="120" y2="115"/>
  <line class="icon-accent icon-glow" x1="75" y1="130" x2="125" y2="130"/>
  <line class="icon-accent icon-glow" x1="75" y1="145" x2="115" y2="145"/>
  
  <!-- Highlight nodes -->
  <circle class="spark spark-anim" cx="90" cy="80" r="2"/>
  <circle class="spark spark-anim" cx="110" cy="130" r="2" style="animation-delay: 0.3s"/>
  <circle class="spark spark-anim" cx="100" cy="95" r="2" style="animation-delay: 0.6s"/>
  
  <!-- Neon border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.5"/>
</svg>
