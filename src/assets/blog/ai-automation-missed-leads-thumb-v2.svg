<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="50%" stop-color="#16213e" />
      <stop offset="100%" stop-color="#0f3460" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-opacity="0.5"/>
    </filter>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
      
      .graffiti-text {
        font-family: 'Fredoka One', cursive;
        font-weight: 700;
        fill: #fbbf24;
        filter: drop-shadow(2px 2px 0px #7c2d12);
      }
      
      .secondary-text {
        font-family: 'Fredoka One', cursive;
        font-weight: 700;
        fill: #22d3ee;
        filter: drop-shadow(1px 1px 0px #1e293b);
      }
      
      .accent-cyan { fill: #22d3ee; }
      .accent-purple { fill: #a855f7; }
      .accent-yellow { fill: #fbbf24; }
      
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      
      .pulse {
        animation: pulse-glow 1.5s ease-in-out infinite;
      }
    </style>
    
    <linearGradient id="phoneGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="1200" fill="url(#bgGradient)"/>
  
  <!-- Graffiti spray texture overlay -->
  <circle cx="150" cy="120" r="100" fill="#a855f7" opacity="0.1"/>
  <circle cx="1050" cy="1000" r="120" fill="#22d3ee" opacity="0.08"/>
  <circle cx="600" cy="600" r="150" fill="#ec4899" opacity="0.06"/>
  
  <!-- Decorative graffiti marks -->
  <path d="M 80 300 Q 120 340 160 310" stroke="#fbbf24" stroke-width="5" fill="none" opacity="0.3" stroke-linecap="round"/>
  <circle cx="1100" cy="150" r="25" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.2"/>
  
  <!-- Left side: PHONE with energy rings -->
  <g transform="translate(300, 500)">
    <!-- Phone device -->
    <rect x="-50" y="-100" width="100" height="200" rx="15" fill="url(#phoneGradient)" filter="url(#shadow)"/>
    <rect x="-40" y="-85" width="80" height="170" rx="12" fill="#0f172a"/>
    
    <!-- Screen content -->
    <circle cx="0" cy="-40" r="15" fill="#22d3ee" opacity="0.6"/>
    <rect x="-30" y="-15" width="60" height="7" rx="3" fill="#22d3ee" opacity="0.4"/>
    <rect x="-30" y="5" width="50" height="5" rx="2" fill="#22d3ee" opacity="0.3"/>
    
    <!-- Ringing energy rings -->
    <g class="pulse" filter="url(#glow)">
      <circle cx="0" cy="0" r="75" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.8"/>
      <circle cx="0" cy="0" r="110" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
      <circle cx="0" cy="0" r="145" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.2"/>
    </g>
  </g>
  
  <!-- Right side: CAUGHT/CAPTURED visual -->
  <g transform="translate(850, 480)">
    <!-- Catching hand -->
    <g transform="translate(0, -15)">
      <!-- Palm -->
      <ellipse cx="0" cy="0" rx="38" ry="48" fill="#fbbf24" opacity="0.9" filter="url(#shadow)"/>
      <!-- Fingers -->
      <ellipse cx="-30" cy="-35" rx="12" ry="30" fill="#fbbf24" opacity="0.95" transform="rotate(-25 -30 -35)"/>
      <ellipse cx="-12" cy="-55" rx="10" ry="35" fill="#fbbf24" opacity="0.95" transform="rotate(-10 -12 -55)"/>
      <ellipse cx="12" cy="-58" rx="10" ry="33" fill="#fbbf24" opacity="0.95" transform="rotate(8 12 -58)"/>
      <ellipse cx="35" cy="-38" rx="12" ry="30" fill="#fbbf24" opacity="0.95" transform="rotate(25 35 -38)"/>
    </g>
    
    <!-- Captured energy ball -->
    <circle cx="0" cy="-8" r="30" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="0" cy="-8" r="30" fill="url(#phoneGradient)" opacity="0.6"/>
    <circle cx="-7" cy="-12" r="10" fill="#ffffff" opacity="0.4"/>
    
    <!-- Energy sparks -->
    <circle cx="-40" cy="-35" r="3.5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="42" cy="-30" r="2.5" fill="#fbbf24" opacity="0.6"/>
    <circle cx="12" cy="-55" r="2.5" fill="#22d3ee" opacity="0.7"/>
  </g>
  
  <!-- Center: AI automation visual -->
  <g transform="translate(600, 300)">
    <!-- Circuit board inspired AI icon -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
    
    <!-- AI neural nodes -->
    <circle cx="0" cy="0" r="6" fill="#a855f7"/>
    <circle cx="-20" cy="-20" r="4" fill="#22d3ee" opacity="0.8"/>
    <circle cx="20" cy="-20" r="4" fill="#22d3ee" opacity="0.8"/>
    <circle cx="-20" cy="20" r="4" fill="#fbbf24" opacity="0.7"/>
    <circle cx="20" cy="20" r="4" fill="#fbbf24" opacity="0.7"/>
    
    <!-- Connecting lines -->
    <line x1="0" y1="0" x2="-20" y2="-20" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="20" y2="-20" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="-20" y2="20" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="0" x2="20" y2="20" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Main headlines -->
  <g transform="translate(600, 820)">
    <text x="0" y="0" font-size="56" text-anchor="middle" class="graffiti-text">
      MISSED CALLS
    </text>
    <text x="0" y="70" font-size="56" text-anchor="middle" class="secondary-text">
      CAPTURED
    </text>
  </g>
  
  <!-- Supporting text -->
  <g transform="translate(600, 960)">
    <text x="0" y="0" font-size="26" text-anchor="middle" class="secondary-text" opacity="0.9">
      AI Automation for Small Businesses
    </text>
  </g>
  
  <!-- Decorative elements -->
  <g transform="translate(120, 1020)">
    <rect x="0" y="0" width="60" height="60" rx="6" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.3"/>
    <rect x="6" y="6" width="48" height="48" rx="4" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.2"/>
  </g>
</svg>
