<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="50%" stop-color="#16213e" />
      <stop offset="100%" stop-color="#0f3460" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-opacity="0.5"/>
    </filter>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
      
      .graffiti-text {
        font-family: 'Fredoka One', cursive;
        font-weight: 700;
        fill: #fbbf24;
        filter: drop-shadow(2px 2px 0px #7c2d12);
      }
      
      .secondary-text {
        font-family: 'Fredoka One', cursive;
        font-weight: 700;
        fill: #22d3ee;
        filter: drop-shadow(1px 1px 0px #1e293b);
      }
      
      .accent-cyan { fill: #22d3ee; }
      .accent-purple { fill: #a855f7; }
      .accent-yellow { fill: #fbbf24; }
      
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      
      .pulse {
        animation: pulse-glow 1.5s ease-in-out infinite;
      }
    </style>
    
    <linearGradient id="phoneGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Graffiti spray texture overlay -->
  <circle cx="150" cy="100" r="90" fill="#a855f7" opacity="0.1"/>
  <circle cx="1050" cy="530" r="110" fill="#22d3ee" opacity="0.08"/>
  <circle cx="600" cy="315" r="130" fill="#ec4899" opacity="0.06"/>
  
  <!-- Decorative graffiti marks -->
  <path d="M 80 250 Q 120 280 160 250" stroke="#fbbf24" stroke-width="4" fill="none" opacity="0.3" stroke-linecap="round"/>
  
  <!-- Left side: PHONE with energy rings -->
  <g transform="translate(250, 315)">
    <!-- Phone device -->
    <rect x="-40" y="-80" width="80" height="160" rx="12" fill="url(#phoneGradient)" filter="url(#shadow)"/>
    <rect x="-32" y="-68" width="64" height="136" rx="10" fill="#0f172a"/>
    
    <!-- Screen content -->
    <circle cx="0" cy="-30" r="12" fill="#22d3ee" opacity="0.6"/>
    <rect x="-24" y="-10" width="48" height="5" rx="2.5" fill="#22d3ee" opacity="0.4"/>
    <rect x="-24" y="5" width="40" height="4" rx="2" fill="#22d3ee" opacity="0.3"/>
    
    <!-- Ringing energy rings -->
    <g class="pulse" filter="url(#glow)">
      <circle cx="0" cy="0" r="60" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.8"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
      <circle cx="0" cy="0" r="120" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.2"/>
    </g>
  </g>
  
  <!-- Right side: CAUGHT/CAPTURED visual -->
  <g transform="translate(750, 300)">
    <!-- Catching hand -->
    <g transform="translate(0, -12)">
      <!-- Palm -->
      <ellipse cx="0" cy="0" rx="32" ry="40" fill="#fbbf24" opacity="0.9" filter="url(#shadow)"/>
      <!-- Fingers -->
      <ellipse cx="-25" cy="-30" rx="10" ry="25" fill="#fbbf24" opacity="0.95" transform="rotate(-25 -25 -30)"/>
      <ellipse cx="-10" cy="-45" rx="8" ry="28" fill="#fbbf24" opacity="0.95" transform="rotate(-10 -10 -45)"/>
      <ellipse cx="10" cy="-48" rx="8" ry="27" fill="#fbbf24" opacity="0.95" transform="rotate(8 10 -48)"/>
      <ellipse cx="30" cy="-32" rx="10" ry="25" fill="#fbbf24" opacity="0.95" transform="rotate(25 30 -32)"/>
    </g>
    
    <!-- Captured energy ball -->
    <circle cx="0" cy="-6" r="25" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="0" cy="-6" r="25" fill="url(#phoneGradient)" opacity="0.6"/>
    <circle cx="-6" cy="-10" r="8" fill="#ffffff" opacity="0.4"/>
    
    <!-- Energy sparks -->
    <circle cx="-35" cy="-28" r="2.5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="35" cy="-25" r="2" fill="#fbbf24" opacity="0.6"/>
    <circle cx="10" cy="-45" r="2" fill="#22d3ee" opacity="0.7"/>
  </g>
  
  <!-- Center: AI automation visual -->
  <g transform="translate(600, 150)">
    <!-- Circuit board inspired AI icon -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
    
    <!-- AI neural nodes -->
    <circle cx="0" cy="0" r="5" fill="#a855f7"/>
    <circle cx="-16" cy="-16" r="3" fill="#22d3ee" opacity="0.8"/>
    <circle cx="16" cy="-16" r="3" fill="#22d3ee" opacity="0.8"/>
    <circle cx="-16" cy="16" r="3" fill="#fbbf24" opacity="0.7"/>
    <circle cx="16" cy="16" r="3" fill="#fbbf24" opacity="0.7"/>
    
    <!-- Connecting lines -->
    <line x1="0" y1="0" x2="-16" y2="-16" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="16" y2="-16" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="-16" y2="16" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="0" x2="16" y2="16" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Main headline -->
  <g transform="translate(600, 430)">
    <text x="0" y="0" font-size="48" text-anchor="middle" class="graffiti-text">
      MISSED CALLS CAPTURED
    </text>
  </g>
  
  <!-- Supporting text -->
  <g transform="translate(600, 510)">
    <text x="0" y="0" font-size="22" text-anchor="middle" class="secondary-text" opacity="0.9">
      AI Automation for Small Businesses
    </text>
  </g>
  
  <!-- MazinMind branding in corner -->
  <g transform="translate(1100, 580)">
    <text x="0" y="0" font-size="16" text-anchor="end" class="secondary-text" opacity="0.7">
      MazinMind Digital
    </text>
  </g>
</svg>
