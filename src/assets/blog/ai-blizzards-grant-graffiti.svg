<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07112B"/>
      <stop offset="0.46" stop-color="#0A2C66"/>
      <stop offset="1" stop-color="#190A38"/>
    </linearGradient>
    <linearGradient id="inkBlue" x1="60" y1="40" x2="980" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C1FF"/>
      <stop offset="0.52" stop-color="#44F2FF"/>
      <stop offset="1" stop-color="#8CFFDE"/>
    </linearGradient>
    <linearGradient id="inkGold" x1="1080" y1="38" x2="1540" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE55A"/>
      <stop offset="0.55" stop-color="#FFC129"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="panelGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BE5FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF8B2D" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonText" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#28D7FF" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#2171FF" flood-opacity="0.3"/>
    </filter>
    <filter id="warmText" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFD54A" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF7A1A" flood-opacity="0.35"/>
    </filter>
    <filter id="sprayNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="#030815" opacity="0.22"/>
  <rect width="1600" height="900" filter="url(#sprayNoise)" opacity="0.25"/>

