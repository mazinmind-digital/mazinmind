<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="50%" stop-color="#16213e" />
      <stop offset="100%" stop-color="#0f3460" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-opacity="0.5"/>
    </filter>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
      
      .graffiti-text {
        font-family: 'Fredoka One', cursive;
        font-weight: 700;
        fill: #fbbf24;
        filter: drop-shadow(2px 2px 0px #7c2d12);
      }
      
      .secondary-text {
        font-family: 'Fredoka One', cursive;
        font-weight: 700;
        fill: #22d3ee;
        filter: drop-shadow(1px 1px 0px #1e293b);
      }
      
      .accent-cyan { fill: #22d3ee; }
      .accent-purple { fill: #a855f7; }
      .accent-yellow { fill: #fbbf24; }
      .accent-neon { fill: #ec4899; }
      
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      
      .pulse {
        animation: pulse-glow 1.5s ease-in-out infinite;
      }
    </style>
    
    <linearGradient id="phoneGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGradient)"/>
  
  <!-- Graffiti spray texture overlay -->
  <circle cx="200" cy="150" r="120" fill="#a855f7" opacity="0.1"/>
  <circle cx="1400" cy="750" r="150" fill="#22d3ee" opacity="0.08"/>
  <circle cx="800" cy="450" r="200" fill="#ec4899" opacity="0.06"/>
  
  <!-- Decorative graffiti marks -->
  <path d="M 100 300 Q 150 350 200 320" stroke="#fbbf24" stroke-width="6" fill="none" opacity="0.3" stroke-linecap="round"/>
  <path d="M 1500 200 L 1550 250 L 1520 280" stroke="#22d3ee" stroke-width="5" fill="none" opacity="0.2" stroke-linecap="round"/>
  <circle cx="1450" cy="150" r="30" fill="none" stroke="#a855f7" stroke-width="4" opacity="0.2"/>
  <circle cx="1480" cy="180" r="25" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.15"/>
  
  <!-- Left side: PHONE with energy rings -->
  <g transform="translate(300, 450)">
    <!-- Phone device -->
    <rect x="-60" y="-120" width="120" height="240" rx="20" fill="url(#phoneGradient)" filter="url(#shadow)"/>
    <rect x="-45" y="-100" width="90" height="200" rx="15" fill="#0f172a"/>
    
    <!-- Screen content -->
    <circle cx="0" cy="-50" r="20" fill="#22d3ee" opacity="0.6"/>
    <rect x="-35" y="-20" width="70" height="8" rx="4" fill="#22d3ee" opacity="0.4"/>
    <rect x="-35" y="0" width="60" height="6" rx="3" fill="#22d3ee" opacity="0.3"/>
    
    <!-- Ringing energy rings -->
    <g class="pulse" filter="url(#glow)">
      <circle cx="0" cy="0" r="90" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.8"/>
      <circle cx="0" cy="0" r="130" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
      <circle cx="0" cy="0" r="170" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.2"/>
    </g>
  </g>
  
  <!-- Right side: CAUGHT/CAPTURED visual -->
  <g transform="translate(1050, 400)">
    <!-- Catching hand illustration -->
    <g transform="translate(0, -20)">
      <!-- Palm -->
      <ellipse cx="0" cy="0" rx="45" ry="55" fill="#fbbf24" opacity="0.9" filter="url(#shadow)"/>
      <!-- Fingers -->
      <ellipse cx="-35" cy="-40" rx="15" ry="35" fill="#fbbf24" opacity="0.95" transform="rotate(-25 -35 -40)"/>
      <ellipse cx="-15" cy="-65" rx="12" ry="40" fill="#fbbf24" opacity="0.95" transform="rotate(-10 -15 -65)"/>
      <ellipse cx="15" cy="-70" rx="12" ry="38" fill="#fbbf24" opacity="0.95" transform="rotate(8 15 -70)"/>
      <ellipse cx="40" cy="-45" rx="14" ry="35" fill="#fbbf24" opacity="0.95" transform="rotate(25 40 -45)"/>
    </g>
    
    <!-- Captured lead/energy ball in hand -->
    <circle cx="0" cy="-10" r="35" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="0" cy="-10" r="35" fill="url(#phoneGradient)" opacity="0.6"/>
    <circle cx="-8" cy="-15" r="12" fill="#ffffff" opacity="0.4"/>
    
    <!-- Energy sparks around caught lead -->
    <circle cx="-45" cy="-40" r="4" fill="#fbbf24" opacity="0.8"/>
    <circle cx="50" cy="-35" r="3" fill="#fbbf24" opacity="0.6"/>
    <circle cx="15" cy="-65" r="3" fill="#22d3ee" opacity="0.7"/>
    <circle cx="-35" cy="20" r="4" fill="#a855f7" opacity="0.7"/>
    
    <!-- Spark lines -->
    <line x1="-35" y1="-50" x2="-50" y2="-65" stroke="#fbbf24" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <line x1="40" y1="-45" x2="60" y2="-55" stroke="#fbbf24" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="20" y1="-60" x2="35" y2="-80" stroke="#22d3ee" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  </g>
  
  <!-- Center: AI automation visual -->
  <g transform="translate(800, 280)">
    <!-- Circuit board inspired AI icon -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.7"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
    
    <!-- AI neural nodes -->
    <circle cx="0" cy="0" r="8" fill="#a855f7"/>
    <circle cx="-25" cy="-25" r="5" fill="#22d3ee" opacity="0.8"/>
    <circle cx="25" cy="-25" r="5" fill="#22d3ee" opacity="0.8"/>
    <circle cx="-25" cy="25" r="5" fill="#fbbf24" opacity="0.7"/>
    <circle cx="25" cy="25" r="5" fill="#fbbf24" opacity="0.7"/>
    
    <!-- Connecting lines -->
    <line x1="0" y1="0" x2="-25" y2="-25" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="25" y2="-25" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="-25" y2="25" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="25" y2="25" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
  </g>
  
  <!-- Main headline - graffiti style -->
  <g transform="translate(800, 620)">
    <text x="0" y="0" font-size="72" text-anchor="middle" class="graffiti-text">
      MISSED CALLS
    </text>
    <text x="0" y="90" font-size="72" text-anchor="middle" class="secondary-text">
      CAPTURED
    </text>
  </g>
  
  <!-- Supporting text -->
  <g transform="translate(800, 750)">
    <text x="0" y="0" font-size="32" text-anchor="middle" class="secondary-text" opacity="0.9">
      AI Automation for Small Businesses
    </text>
  </g>
  
  <!-- Decorative corner elements -->
  <g transform="translate(150, 750)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.3"/>
    <rect x="8" y="8" width="64" height="64" rx="6" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.2"/>
  </g>
  
  <g transform="translate(1420, 100)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.25"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.2"/>
  </g>
</svg>
