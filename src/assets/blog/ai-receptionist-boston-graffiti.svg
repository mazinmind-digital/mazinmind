<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
      
      .graffiti-text {
        font-family: 'Fredoka One', cursive;
        font-size: 72px;
        font-weight: bold;
        fill: #fbbf24;
        text-anchor: middle;
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        letter-spacing: 2px;
      }
      
      .graffiti-subtext {
        font-family: 'Fredoka One', cursive;
        font-size: 32px;
        fill: #22d3ee;
        text-anchor: middle;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      }
      
      .pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      
      .bounce {
        animation: bounce 1.5s ease-in-out infinite;
      }
      
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
    </style>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1b4e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGradient)"/>
  
  <!-- Graffiti texture overlay -->
  <rect width="1600" height="900" fill="url(#bgGradient)" opacity="0.1"/>
  
  <!-- Left side: Phone and energy rings -->
  <g transform="translate(300, 450)">
    <!-- Energy rings -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6" class="pulse"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.4" class="pulse" style="animation-delay: 0.3s"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.2" class="pulse" style="animation-delay: 0.6s"/>
    
    <!-- Phone body -->
    <rect x="-35" y="-80" width="70" height="140" rx="8" fill="#1f2937" stroke="#22d3ee" stroke-width="3"/>
    
    <!-- Phone screen -->
    <rect x="-30" y="-75" width="60" height="110" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
    
    <!-- Phone icon -->
    <circle cx="0" cy="-25" r="12" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <line x1="-8" y1="-33" x2="-12" y2="-40" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="-33" x2="12" y2="-40" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Speaker indicator -->
    <rect x="-20" y="30" width="40" height="12" rx="2" fill="#22d3ee" opacity="0.5"/>
  </g>
  
  <!-- Center: AI circuit board / neural network -->
  <g transform="translate(800, 450)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="25" fill="#22d3ee" filter="url(#glow)"/>
    
    <!-- Outer nodes -->
    <circle cx="-60" cy="-60" r="12" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="60" cy="-60" r="12" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="-80" cy="0" r="12" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="80" cy="0" r="12" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="-60" cy="60" r="12" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="60" cy="60" r="12" fill="#fbbf24" filter="url(#glow)"/>
    
    <!-- Connecting lines -->
    <line x1="0" y1="0" x2="-60" y2="-60" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="60" y2="-60" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="-80" y2="0" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="80" y2="0" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="-60" y2="60" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="60" y2="60" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Right side: Catching hand -->
  <g transform="translate(1300, 450)">
    <!-- Hand -->
    <path d="M -30,-50 L -40,-80 M -10,-60 L -15,-90 M 10,-60 L 10,-95 M 30,-50 L 40,-85 M 50,-40 L 55,-70" 
          stroke="#fbbf24" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Palm -->
    <ellipse cx="0" cy="0" rx="35" ry="45" fill="none" stroke="#fbbf24" stroke-width="3"/>
    
    <!-- Lead indicator dots -->
    <circle cx="-15" cy="-30" r="6" fill="#ec4899" filter="url(#glow)" class="pulse"/>
    <circle cx="15" cy="-20" r="6" fill="#a855f7" filter="url(#glow)" class="pulse" style="animation-delay: 0.3s"/>
    <circle cx="0" cy="15" r="6" fill="#22d3ee" filter="url(#glow)" class="pulse" style="animation-delay: 0.6s"/>
  </g>
  
  <!-- Top headline -->
  <text x="800" y="120" class="graffiti-text">CATCH EVERY CALL</text>
  
  <!-- Bottom subtitle -->
  <text x="800" y="820" class="graffiti-subtext">AI Receptionist for Boston Service Businesses</text>
  
  <!-- Corner accent: Boston marker -->
  <g transform="translate(120, 100)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <text x="0" y="8" font-family="'Fredoka One', cursive" font-size="16" fill="#22d3ee" text-anchor="middle" font-weight="bold">BOS</text>
  </g>
  
  <!-- Small decorative elements -->
  <g opacity="0.3">
    <circle cx="100" cy="200" r="30" fill="none" stroke="#a855f7" stroke-width="2"/>
    <circle cx="1500" cy="700" r="40" fill="none" stroke="#ec4899" stroke-width="2"/>
    <rect x="200" y="750" width="60" height="60" fill="none" stroke="#fbbf24" stroke-width="2"/>
  </g>
</svg>
