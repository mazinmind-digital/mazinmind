<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
      
      .og-title {
        font-family: 'Fredoka One', cursive;
        font-size: 56px;
        font-weight: 900;
        fill: #22d3ee;
        filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.6)) drop-shadow(2px 2px 3px rgba(0,0,0,0.8));
        letter-spacing: 1px;
      }
      
      .og-subtitle {
        font-family: 'Fredoka One', cursive;
        font-size: 28px;
        fill: #fbbf24;
        filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.5)) drop-shadow(1px 1px 2px rgba(0,0,0,0.8));
      }
      
      .og-branding {
        font-family: Arial, sans-serif;
        font-size: 16px;
        fill: #a0aec0;
        opacity: 0.9;
      }
    </style>
    
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a2744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1b4e;stop-opacity:1" />
    </linearGradient>
    
    <filter id="ogNeon">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  
  <!-- Decorative grid -->
  <g stroke="#22d3ee" stroke-width="0.5" opacity="0.08">
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  
  <!-- Left visual element: Earth with seismic indicator -->
  <g>
    <!-- Earth circle -->
    <circle cx="150" cy="315" r="85" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6" filter="url(#ogNeon)"/>
    
    <!-- Earth sphere gradient -->
    <defs>
      <radialGradient id="earthGrad" cx="40%" cy="40%" r="60%">
        <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.3" />
        <stop offset="100%" style="stop-color:#164e63;stop-opacity:0.1" />
      </radialGradient>
    </defs>
    
    <circle cx="150" cy="315" r="85" fill="url(#earthGrad)"/>
    
    <!-- Fault line -->
    <path d="M 80 280 Q 120 310 170 330" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.7" filter="url(#ogNeon)"/>
    
    <!-- Seismic wave -->
    <path d="M 50 350 L 60 345 L 70 355 L 80 345 L 90 355 L 100 345 L 110 355 L 120 345 L 130 355 L 140 345 L 150 355 L 160 345 L 170 355 L 180 345 L 190 355 L 200 350" 
          stroke="#a855f7" stroke-width="2" fill="none" opacity="0.6" filter="url(#ogNeon)"/>
  </g>
  
  <!-- Center content -->
  <g>
    <!-- Main title -->
    <text x="600" y="180" class="og-title" text-anchor="middle">
      Can AI Predict
    </text>
    <text x="600" y="250" class="og-title" text-anchor="middle">
      Earthquakes?
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="320" class="og-subtitle" text-anchor="middle">
      AI in Disaster Forecasting
    </text>
    
    <!-- Accent line -->
    <line x1="250" y1="355" x2="950" y2="355" stroke="#22d3ee" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Right visual element: AI nodes -->
  <g>
    <!-- Node cluster -->
    <circle cx="1050" cy="280" r="6" fill="#22d3ee" opacity="0.8"/>
    <circle cx="1050" cy="280" r="10" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
    
    <circle cx="1100" cy="310" r="6" fill="#a855f7" opacity="0.8"/>
    <circle cx="1100" cy="310" r="10" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
    
    <circle cx="1020" cy="350" r="6" fill="#fbbf24" opacity="0.8"/>
    <circle cx="1020" cy="350" r="10" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
    
    <!-- Connection lines -->
    <line x1="1050" y1="280" x2="1100" y2="310" stroke="#22d3ee" stroke-width="1" opacity="0.2"/>
    <line x1="1050" y1="280" x2="1020" y2="350" stroke="#a855f7" stroke-width="1" opacity="0.2"/>
    <line x1="1100" y1="310" x2="1020" y2="350" stroke="#fbbf24" stroke-width="1" opacity="0.2"/>
  </g>
  
  <!-- Footer branding -->
  <g>
    <!-- Branding bar -->
    <rect x="0" y="560" width="1200" height="70" fill="rgba(10,22,40,0.5)"/>
    <line x1="0" y1="560" x2="1200" y2="560" stroke="#22d3ee" stroke-width="1" opacity="0.2"/>
    
    <!-- Logo text -->
    <text x="30" y="600" class="og-branding" font-weight="bold">
      MazinMind Digital
    </text>
    
    <!-- Secondary text -->
    <text x="1170" y="600" class="og-branding" text-anchor="end">
      mazinmind.digital/blog
    </text>
  </g>
</svg>
