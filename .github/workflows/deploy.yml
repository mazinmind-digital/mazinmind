name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || 'G-ZQQDFCCDXP' }}
      VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check lockfile is up to date
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Inject consent-gated Zoho conversion tracking
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || 'G-ZQQDFCCDXP' }}
        run: |
          test -f dist/zoho-form-success.html
          node -e 'if (!/^G-[A-Z0-9]+$/i.test(process.env.VITE_GA_MEASUREMENT_ID || "")) process.exit(1)'
          sed -i "s|__GA_MEASUREMENT_ID__|${VITE_GA_MEASUREMENT_ID}|g" dist/zoho-form-success.html

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: SPA fallback for React Router
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Ensure custom domain
        run: echo "mazinmind.digital" > dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
; then
            echo "Invalid Google Analytics measurement ID" >&2
            exit 1
          fi
          sed -i "s/__GA_MEASUREMENT_ID__/$VITE_GA_MEASUREMENT_ID/g" dist/zoho-form-success.html

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: SPA fallback for React Router
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Ensure custom domain
        run: echo "mazinmind.digital" > dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
