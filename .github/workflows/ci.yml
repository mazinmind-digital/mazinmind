name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Inject consent-gated Zoho conversion tracking
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || 'G-ZQQDFCCDXP' }}
        run: |
          test -f dist/zoho-form-success.js
          node -e 'if (!/^G-[A-Z0-9]+$/i.test(process.env.VITE_GA_MEASUREMENT_ID || "")) process.exit(1)'
          sed -i "s|__GA_MEASUREMENT_ID__|${VITE_GA_MEASUREMENT_ID}|g" dist/zoho-form-success.js

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run test:e2e
